
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.cloady

    ports:
      - "8080:8080"

    environment:
      APP_ENV: "prod"
      HTTP_PORT: "8080"

      CORS_ALLOW_ORIGIN: "${CLOADY_PRIMARY_URL}"
      PUBLIC_API_BASE_URL: "${CLOADY_PRIMARY_URL}"
      PUBLIC_WEB_BASE_URL: "${CLOADY_PRIMARY_URL}"

      JWT_SECRET: "${JWT_SECRET}"
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY}"

    volumes:
      - app_storage:/app/storage
      - app_data:/app/data

volumes:
  app_storage:
    name: deeix-chat-app-storage

  app_data:
    name: deeix-chat-app-data
